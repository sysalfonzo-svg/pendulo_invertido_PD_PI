[platformio]
default_envs = diagnostico_usb

[env]
platform = ststm32@19.6.0
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = genericSTM32F401RC
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags = 
  -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  -D HAL_IWDG_MODULE_ENABLED

[env:diagnostico_usb]
build_flags =
  ${env.build_flags}
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D ENABLE_ESP32_TX=0
  -D EQUILIBRIO=0

[env:equilibrio_usb]
build_flags =
  ${env.build_flags}
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D ENABLE_ESP32_TX=0
  -D EQUILIBRIO=1

[env:equilibrio_esp]
build_flags =
  ${env.build_flags}
  -D ENABLE_ESP32_TX=1
  -D EQUILIBRIO=1

[env:banco_usb]
extends = env:diagnostico_usb
build_flags =
  ${env:diagnostico_usb.build_flags}
  -D BANCO=1
